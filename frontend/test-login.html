<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #006B3F, #0055A0); }
        .login-box { background: white; padding: 40px; border-radius: 20px; text-align: center; width: 350px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 2px solid #ddd; }
        button { background: #006B3F; color: white; cursor: pointer; border: none; }
        .status { margin-top: 10px; font-size: 12px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>? Midvaalens YD</h2>
        <input type="password" id="password" placeholder="Password" />
        <button onclick="login()">Login</button>
        <div id="status" class="status"></div>
    </div>
    <script>
        const API_URL = "https://soccer-manager-61iv.onrender.com/api";
        
        async function login() {
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');
            
            try {
                const response = await fetch(`${API_URL}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: 'admin', password: password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = '? Login successful!';
                    statusDiv.className = 'status success';
                    setTimeout(() => {
                        alert('Welcome Admin! Your app is working!');
                    }, 500);
                } else {
                    statusDiv.innerHTML = '? Wrong password. Try: admin123';
                    statusDiv.className = 'status error';
                }
            } catch (error) {
                statusDiv.innerHTML = '? Cannot connect to backend';
                statusDiv.className = 'status error';
            }
        }
    </script>
</body>
</html>
