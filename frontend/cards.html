<!DOCTYPE html>
<html>
<head>
<title>Player Cards</title>

<style>
body {
    font-family: Arial;
    background: #0b3d2e;
    color: white;
    padding: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
}

.card {
    background: linear-gradient(135deg, #1c1c1c, #333);
    padding: 10px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

.card img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    background: #555;
}

.badge {
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    margin-top: 5px;
    display: inline-block;
}

.u13 { background: #00c853; }
.u15 { background: #2962ff; }

button {
    margin-top: 6px;
    padding: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Player Cards</h2>

<div class="grid" id="cardGrid"></div>

<script>
const API_URL = "https://soccer-manager-61iv.onrender.com/api";

window.players = [];

async function loadPlayers() {
    const res = await fetch(`${API_URL}/players`);
    const data = await res.json();
    window.players = Array.isArray(data) ? data : (data.players || []);
    renderCards();
}

function renderCards() {
    const grid = document.getElementById("cardGrid");

    grid.innerHTML = window.players.map(p => `
        <div class="card">
            <img src="${p.photo || ''}" />
            <h3>${p.name}</h3>
            <p>${p.position || ''}</p>

            <span class="badge ${p.ageGroup === 'U15' ? 'u15' : 'u13'}">
                ${p.ageGroup || 'U13'}
            </span>

            <p>Age: ${p.age || ''}</p>
            <p>${p.paid ? "Paid" : "Unpaid"}</p>
        </div>
    `).join('');
}

loadPlayers();
</script>

<style>
  .fifa-card {
    background: linear-gradient(135deg, #1b1b1b, #2d2d2d);
    color: white;
    padding: 12px;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.2s;
}

.fifa-card:hover {
    transform: scale(1.03);
}

.top {
    display: flex;
    gap: 10px;
    align-items: center;
}

.fifa-card img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
}

.badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    margin: 8px 0;
}

.u13 { background: #00c853; }
.u15 { background: #2962ff; }

.stats {
    margin-top: 8px;
}

.stat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
}

.bar {
    flex: 1;
    height: 6px;
    background: #444;
    border-radius: 4px;
    overflow: hidden;
}

.bar div {
    height: 100%;
    background: #00c853;
}

.footer {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
}
</style>

</body>
</html>
