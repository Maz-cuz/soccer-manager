services:
  - type: web
    name: soccer-manager
    runtime: node
    repo: https://github.com/YOUR_USERNAME/soccer-manager
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000